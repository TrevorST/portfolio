name: PR title

# PRs are squash-merged and the PR title becomes the commit on main, so the
# title is what release-please reads. It must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            perf
            refactor
            style
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
