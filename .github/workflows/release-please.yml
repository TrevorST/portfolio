name: Release

# On every push to main, release-please updates (or opens) a "chore(main):
# release x.y.z" PR with the changelog written from Conventional Commits.
# Merging that PR tags the version and publishes a GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
